<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('assets/bgr.png') no-repeat center center;
            background-size: cover;
        }

        .video-wrapper {
            position: relative;
            z-index: 10;
            width: 65%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: auto;
        }

        /* Lớp phủ màn hình tải */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Animation Sprite Cup */
        .cup-animation {
            width: 313px;
            height: 627px; /* 5016 / 8 = 627px */
            background-image: url('assets/cup.png'), url('cup.png');
            background-repeat: no-repeat;
            background-position: 0 0;
            animation: playCup 1.2s steps(8) infinite;
            transform: scale(0.25);
            margin: -210px 0; /* Thu hẹp khoảng trống do scale */
        }

        @keyframes playCup {
            from { background-position-y: 0px; }
            to { background-position-y: -5016px; }
        }

        /* Dòng chữ Đang tải video... */
        .loading-text {
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        /* Chấm chạy lặp lại 1 -> 2 -> 3 chấm */
        .dots::after {
            content: '';
            animation: loadingDots 1.5s infinite steps(4, jump-none);
        }

        @keyframes loadingDots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- Lớp phủ lúc tải video -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="cup-animation"></div>
            <div class="loading-text">Đang tải video<span class="dots"></span></div>
        </div>

        <video id="mainVideo" controls controlsList="nodownload">
            <source src="assets/video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const overlay = document.getElementById('loadingOverlay');
        const fallbackLink = "Gắn link cho mình"; // Điền link dự phòng vào đây

        // Tắt màn hình tải khi video đã nạp đủ dữ liệu để phát
        const hideLoading = () => {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 400);
        };

        video.addEventListener('canplay', hideLoading);

        // Kiểm tra nếu file assets/video.mp4 lỗi/không có thì chuyển link dự phòng
        video.querySelector('source').addEventListener('error', () => {
            if (fallbackLink && fallbackLink !== "Gắn link cho mình") {
                video.src = fallbackLink;
                video.load();
            }
        });

        // Chặn menu chuột phải, kéo thả và phím tắt
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && ['u', 's', 'c'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
